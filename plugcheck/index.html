<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>PlugCheck</title>
<style>
  :root { --bg:#f5f5f7; --card:#fff; --text:#1d1d1f; --sub:#6e6e73; --accent:#0071e3; --ok:#28a745; --field:#f2f2f4; }
  @media (prefers-color-scheme: dark) { :root { --bg:#000; --card:#1c1c1e; --text:#f5f5f7; --sub:#98989d; --accent:#0a84ff; --ok:#30d158; --field:#2c2c2e; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
         font:17px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; padding:16px; }
  .card { width:100%; max-width:440px; background:var(--card); border-radius:20px; padding:32px 28px; text-align:center;
          box-shadow:0 10px 40px rgba(0,0,0,.08); }
  .icon { width:56px; height:56px; border-radius:50%; background:var(--ok); color:#fff; display:grid; place-items:center;
          font-size:30px; margin:0 auto 16px; }
  h1 { font-size:24px; font-weight:600; margin:0 0 6px; letter-spacing:-.01em; }
  p { color:var(--sub); margin:0 0 22px; }
  button { width:100%; border:0; border-radius:12px; padding:14px; font:600 17px -apple-system, sans-serif;
           background:var(--accent); color:#fff; cursor:pointer; transition:transform .15s ease, background .2s; }
  button:active { transform:scale(.98); }
  button.done { background:var(--ok); }
  code { display:block; margin-top:16px; padding:10px 12px; background:var(--field); border-radius:10px; color:var(--sub);
         font:12px ui-monospace, SFMono-Regular, Menlo, monospace; word-break:break-all; text-align:left; user-select:all; }
</style>
</head>
<body>
<main class="card" id="card"></main>
<script>
  const card = document.getElementById('card');
  const q = new URLSearchParams(location.search);
  if (q.get('code')) {
    card.innerHTML = '<div class="icon">✓</div><h1>Signed in to Tesla</h1>' +
      '<p>Copy this, then paste it into Terminal.</p><button id="copy">Copy</button><code id="url"></code>';
    document.getElementById('url').textContent = location.href;
    const b = document.getElementById('copy');
    b.onclick = async () => {
      try { await navigator.clipboard.writeText(location.href); }
      catch (e) { const r = document.createRange(); r.selectNodeContents(document.getElementById('url'));
                  const s = getSelection(); s.removeAllRanges(); s.addRange(r); document.execCommand('copy'); }
      b.textContent = 'Copied — now paste into Terminal'; b.classList.add('done');
    };
  } else if (q.get('error')) {
    card.innerHTML = '<h1>Sign-in didn’t finish</h1><p></p>';
    card.querySelector('p').textContent = (q.get('error_description') || q.get('error')) + ' — run the setup again.';
  } else {
    card.innerHTML = '<h1>PlugCheck</h1><p>This page finishes the Tesla sign-in during PlugCheck setup.</p>';
  }
</script>
</body>
</html>
